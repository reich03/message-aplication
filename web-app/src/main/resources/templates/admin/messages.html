<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Mensajes - Sistema de Mensajería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-comments"></i> Sistema de Mensajería
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/users">
                    <i class="fas fa-users"></i> Usuarios
                </a>
                <a class="nav-link" href="/messages">
                    <i class="fas fa-envelope"></i> Mensajes
                </a>
                <a class="nav-link" href="/reports">
                    <i class="fas fa-chart-bar"></i> Reportes
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-envelope-open-text"></i> Administración de Mensajes
                </h1>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <form method="get" action="/admin/messages">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="type" class="form-label">Tipo de Mensaje</label>
                            <select class="form-select" id="type" name="type">
                                <option value="">Todos los tipos</option>
                                <option value="TEXT">Texto</option>
                                <option value="FILE">Archivo</option>
                                <option value="IMAGE">Imagen</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="page" class="form-label">Página</label>
                            <input type="number" class="form-control" id="page" name="page" value="0" min="0">
                        </div>
                        <div class="col-md-3">
                            <label for="size" class="form-label">Elementos por página</label>
                            <select class="form-select" id="size" name="size">
                                <option value="10">10</option>
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> Filtrar
                                </button>
                                <a href="/admin/messages" class="btn btn-secondary">
                                    <i class="fas fa-refresh"></i> Limpiar
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de mensajes -->
        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(messages)}" class="text-center text-muted py-4">
                    <i class="fas fa-envelope fa-3x mb-3"></i>
                    <p>No hay mensajes en el sistema</p>
                </div>
                
                <div th:if="${!#lists.isEmpty(messages)}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Remitente</th>
                                <th>Destinatario</th>
                                <th>Tipo</th>
                                <th>Contenido</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="message : ${messages}">
                                <td th:text="${message.id}">1</td>
                                <td>
                                    <span th:if="${message.sender != null}" th:text="${message.sender.username}">admin</span>
                                    <span th:if="${message.sender == null}" class="text-muted">Sistema</span>
                                </td>
                                <td>
                                    <span th:if="${message.receiver != null}" th:text="${message.receiver.username}">user</span>
                                    <span th:if="${message.receiver == null}" class="text-muted">Todos</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${message.messageType.name() == 'TEXT'} ? 'bg-primary' : 
                                                         (${message.messageType.name() == 'FILE'} ? 'bg-success' : 'bg-info')"
                                          th:text="${message.messageType.name()}">TEXT</span>
                                </td>
                                <td>
                                    <div th:if="${message.messageType.name() == 'TEXT'}" 
                                         th:text="${#strings.abbreviate(message.content, 50)}" 
                                         class="text-truncate" style="max-width: 200px;">
                                        Contenido del mensaje...
                                    </div>
                                    <div th:if="${message.messageType.name() != 'TEXT'}" 
                                         th:text="${message.fileName ?: 'Archivo'}" 
                                         class="text-truncate" style="max-width: 200px;">
                                        archivo.txt
                                    </div>
                                </td>
                                <td th:text="${message.sentAt}">2025-09-30 15:00:00</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <button class="btn btn-sm btn-outline-primary" 
                                                th:onclick="'showMessage(' + ${message.id} + ')'" 
                                                title="Ver detalles">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" 
                                                th:onclick="'deleteMessage(' + ${message.id} + ')'" 
                                                title="Eliminar mensaje">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles del mensaje -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles del Mensaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="messageDetails">
                    <!-- Contenido cargado dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showMessage(messageId) {
            // Aquí podrías cargar los detalles del mensaje via AJAX
            document.getElementById('messageDetails').innerHTML = 
                '<p>ID del mensaje: ' + messageId + '</p>' +
                '<p>Esta funcionalidad se puede expandir para mostrar más detalles.</p>';
            
            var modal = new bootstrap.Modal(document.getElementById('messageModal'));
            modal.show();
        }

        function deleteMessage(messageId) {
            if (confirm('¿Estás seguro de eliminar este mensaje?')) {
                // Aquí podrías implementar la eliminación via AJAX
                alert('Funcionalidad de eliminación pendiente de implementar');
            }
        }
    </script>
</body>
</html>
