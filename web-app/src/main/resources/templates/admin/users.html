<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios - Sistema de Mensajería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-comments"></i> Sistema de Mensajería
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/users">
                    <i class="fas fa-users"></i> Usuarios
                </a>
                <a class="nav-link" href="/messages">
                    <i class="fas fa-envelope"></i> Mensajes
                </a>
                <a class="nav-link" href="/reports">
                    <i class="fas fa-chart-bar"></i> Reportes
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>
                        <i class="fas fa-user-cog"></i> Administración de Usuarios
                    </h1>
                    <a href="/users/new" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Nuevo Usuario
                    </a>
                </div>
            </div>
        </div>

        <!-- Tabla de usuarios con acciones administrativas -->
        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(users)}" class="text-center text-muted py-4">
                    <i class="fas fa-users fa-3x mb-3"></i>
                    <p>No hay usuarios registrados</p>
                </div>
                
                <div th:if="${!#lists.isEmpty(users)}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Conexión</th>
                                <th>Última Conexión</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td>
                                    <strong th:text="${user.username}">admin</strong>
                                </td>
                                <td th:text="${user.email}">admin@messaging.com</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.status.name() == 'APPROVED'} ? 'bg-success' : 
                                                         (${user.status.name() == 'PENDING'} ? 'bg-warning' : 'bg-danger')"
                                          th:text="${user.status.name()}">APPROVED</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.connected} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${user.connected} ? 'Conectado' : 'Desconectado'">Conectado</span>
                                </td>
                                <td th:text="${user.lastConnection}">-</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/users/{id}(id=${user.id})}" 
                                           class="btn btn-sm btn-outline-primary" title="Ver detalles">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/users/{id}/edit(id=${user.id})}" 
                                           class="btn btn-sm btn-outline-warning" title="Editar">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        
                                        <!-- Acciones administrativas -->
                                        <form th:action="@{/users/{id}/approve(id=${user.id})}" 
                                              method="post" class="d-inline"
                                              th:if="${user.status.name() == 'PENDING'}">
                                            <button type="submit" class="btn btn-sm btn-outline-success" title="Aprobar">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </form>
                                        
                                        <form th:action="@{/users/{id}/reject(id=${user.id})}" 
                                              method="post" class="d-inline"
                                              th:if="${user.status.name() == 'PENDING'}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Rechazar">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </form>
                                        
                                        <form th:action="@{/users/{id}/delete(id=${user.id})}" 
                                              method="post" class="d-inline"
                                              th:if="${user.username != 'admin'}"
                                              onsubmit="return confirm('¿Estás seguro de eliminar este usuario?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
