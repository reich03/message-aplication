<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Nuevo Usuario - Sistema de Mensajería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-comments"></i> Sistema de Mensajería
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/users">
                    <i class="fas fa-users"></i> Usuarios
                </a>
                <a class="nav-link" href="/messages">
                    <i class="fas fa-envelope"></i> Mensajes
                </a>
                <a class="nav-link" href="/reports">
                    <i class="fas fa-chart-bar"></i> Reportes
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fas fa-user-edit"></i>
                            <span th:text="${user.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Nuevo Usuario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${user.id != null ? '/users/' + user.id : '/users'}" 
                              th:object="${user}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Nombre de Usuario *</label>
                                        <input type="text" class="form-control" id="username" 
                                               th:field="*{username}" required>
                                        <div class="form-text">Nombre único para el usuario</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email *</label>
                                        <input type="email" class="form-control" id="email" 
                                               th:field="*{email}" required>
                                        <div class="form-text">Dirección de correo electrónico</div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="status" class="form-label">Estado</label>
                                        <select class="form-select" id="status" th:field="*{status}">
                                            <option value="PENDING">Pendiente</option>
                                            <option value="APPROVED">Aprobado</option>
                                            <option value="REJECTED">Rechazado</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="maxConnections" class="form-label">Máx. Conexiones</label>
                                        <input type="number" class="form-control" id="maxConnections" 
                                               th:field="*{maxConnections}" min="1" max="10" value="3">
                                        <div class="form-text">Número máximo de conexiones simultáneas</div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="maxFilesPerDay" class="form-label">Máx. Archivos/Día</label>
                                        <input type="number" class="form-control" id="maxFilesPerDay" 
                                               th:field="*{maxFilesPerDay}" min="1" max="100" value="10">
                                        <div class="form-text">Número máximo de archivos por día</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3" th:if="${user.id != null}">
                                <label for="password" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password" 
                                       name="password" placeholder="Dejar vacío para mantener la actual">
                                <div class="form-text">Solo si desea cambiar la contraseña</div>
                            </div>

                            <div class="mb-3" th:if="${user.id == null}">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" id="password" 
                                       name="password" required>
                                <div class="form-text">Contraseña para el nuevo usuario</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/users" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Volver
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i>
                                    <span th:text="${user.id != null ? 'Actualizar' : 'Crear'}">Crear</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
